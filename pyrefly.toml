# Pyrefly Configuration
# Exclude exploratory Jupyter Notebooks from static type checking

project-includes = ["."]
project-excludes = [
    "**/ipynb/**",
    "**/*.ipynb",
    "ipynb/**"
]
search-path = [
    "backend",
    "backend/models",
    "backend/models/human_in_loop"
]
use-ignore-files = true

[errors]
untyped-import = "ignore"

